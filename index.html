<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abdu's Fintracker</title>
<meta name="description" content="Track spending across banks, subscriptions and debts, and save every month.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fintracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14151d" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single statement column — savings goal up top, then week, then detail; tabs for the ledger sections */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --sunk:#e9ebf2; --line:#d6d9e4;
  --fg:#1b1d2a; --muted:#5d6176; --accent:#5b3a9e; --accent-soft:#ece6f8; --on-accent:#ffffff;
  --good:#1f7a4d; --good-soft:#e2f3ea; --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe4e2;
  --bar:#b9a8de; --bar-now:#5b3a9e;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14151d; --surface:#1d1f2a; --sunk:#252836; --line:#343849;
  --fg:#eceef5; --muted:#a2a6bb; --accent:#b69cf0; --accent-soft:#2e2647; --on-accent:#1a1430;
  --good:#6fd39f; --good-soft:#18352a; --warn:#f0b65a; --warn-soft:#3a2c14; --bad:#ff8a80; --bad-soft:#3d1d1c;
  --bar:#55487a; --bar-now:#b69cf0; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#14151d; --surface:#1d1f2a; --sunk:#252836; --line:#343849;
  --fg:#eceef5; --muted:#a2a6bb; --accent:#b69cf0; --accent-soft:#2e2647; --on-accent:#1a1430;
  --good:#6fd39f; --good-soft:#18352a; --warn:#f0b65a; --warn-soft:#3a2c14; --bad:#ff8a80; --bad-soft:#3d1d1c;
  --bar:#55487a; --bar-now:#b69cf0; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:1.5rem}
h2{font-size:1.1rem}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:4px 12px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
nav.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:8px;white-space:nowrap;color:var(--muted);font-weight:500}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}

.banner{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.grid2>*{min-width:0}

/* Savings hero */
.goal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.goal .big{font-family:var(--f-display);font-size:2.4rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.meter{height:12px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:12px}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.meter.thin{height:8px}
.meter.good>i{background:var(--good)} .meter.warn>i{background:var(--warn)} .meter.bad>i{background:var(--bad)}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.plain{background:var(--sunk);color:var(--muted)}

.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.plan>div{background:var(--surface);padding:12px 14px}
.plan .v{font-family:var(--f-mono);font-size:1.05rem;font-variant-numeric:tabular-nums;margin-top:2px}
.plan .op{color:var(--muted);font-family:var(--f-mono)}
.plan .result{background:var(--accent-soft)}
.plan .result .v{color:var(--accent);font-weight:500}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{min-width:0}
.item .name{font-weight:500;overflow-wrap:anywhere}
.item .amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.amt.in{color:var(--good)} .amt.save{color:var(--accent)}
.dayhead{font-size:.8rem;color:var(--muted);font-weight:600;padding-top:14px;padding-bottom:2px;border-bottom:1px solid var(--line)}

.catbar{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:10px;align-items:center;padding:4px 0}
.catbar .track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.catbar .track i{display:block;height:100%;background:var(--bar-now);border-radius:99px}

.chartbox{overflow-x:auto}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}

.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.tips li{padding-left:14px;border-left:3px solid var(--accent);}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,10,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:640px){.sheet-bg{align-items:center}}
.sheet{background:var(--surface);color:var(--fg);border-radius:14px;width:100%;max-width:460px;max-height:90vh;overflow:auto;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:.85rem;font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%;font-size:16px}
.filters select{font-size:16px}
img{max-width:100%}[hidden]{display:none!important}
.toggle{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.toggle:first-of-type{border-top:0}.toggle input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:8px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:.9rem;z-index:30}
.empty{padding:22px 4px;text-align:center;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px}
.preview{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:8px 0}
.preview table{border-collapse:collapse;font-size:.8rem;width:100%}
.preview td,.preview th{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Abdu's Fintracker</h1><span class="muted small" id="monthLabel"></span></div>
    <div class="row">
      <button class="btn" id="addSaveBtn" type="button">Log savings</button>
      <button class="btn primary" id="addTxBtn" type="button">Add spending</button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="overview" aria-selected="true" type="button">Overview</button>
    <button role="tab" data-tab="goals" aria-selected="false" type="button">Goals</button>
    <button role="tab" data-tab="spending" aria-selected="false" type="button">Spending</button>
    <button role="tab" data-tab="subs" aria-selected="false" type="button">Subscriptions</button>
    <button role="tab" data-tab="debts" aria-selected="false" type="button">Debts</button>
    <button role="tab" data-tab="banks" aria-selected="false" type="button">Banks &amp; import</button>
    <button role="tab" data-tab="plan" aria-selected="false" type="button">Plan &amp; settings</button>
  </nav>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const gbp=(n,dp)=>{const v=Math.round((n||0)*100)/100;const d=dp??(Math.abs(v)>=1000||Number.isInteger(v)?0:2);return (v<0?"−":"")+"£"+Math.abs(v).toLocaleString("en-GB",{minimumFractionDigits:d,maximumFractionDigits:d});};
const gbp2=n=>gbp(n,2);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseISO=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c);};
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());};
const DAY=864e5;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const weekStart=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
const monthKey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const daysInMonth=d=>new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
const fmtDay=d=>d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const fmtShort=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const WEEKS_PER_MONTH=52/12;

const CATS=["Groceries","Eating out","Transport","Bills","Subscriptions","Debt repayment","Shopping","Family support","Education","Health","Fun","Other"];
const CAT_RULES=[
 ["Debt repayment",/klarna|clearpay|laybuy|pay ?in ?3|\bloan\b|barclaycard|credit card payment|amex|zilch/i],
 ["Groceries",/tesco|sainsbury|lidl|aldi|asda|co-?op|morrisons|iceland|waitrose|m&s food|marks.*spencer|halal|butcher|grocer|supermarket/i],
 ["Eating out",/deliveroo|just ?eat|uber ?eats|mcdonald|kfc|nando|greggs|costa|pret|starbucks|caffe|cafe|restaurant|pizza|burger|subway|chicken/i],
 ["Transport",/tfl|transport for london|uber(?! ?eats)|bolt|trainline|national rail|shell|bp |esso|texaco|petrol|fuel|parking|ringgo|dvla|car wash|insurance/i],
 ["Subscriptions",/netflix|spotify|prime video|amazon prime|disney|apple\.com|itunes|icloud|google (one|storage|play)|youtube|chatgpt|openai|anthropic|claude|adobe|xbox|playstation|now tv|audible|puregym|the gym|gym/i],
 ["Bills",/\bee\b|vodafone|\bo2\b|three\.co|giffgaff|lebara|lyca|thames water|british gas|octopus|edf|e\.on|ovo|council tax|tv licen|virgin media|bt group|sky |rent|landlord/i],
 ["Shopping",/amazon|ebay|argos|primark|tk ?maxx|boots|superdrug|currys|ikea|zara|h&m|sports direct|jd sports/i],
 ["Family support",/western union|remitly|wise|worldremit|lemfi|taptap|sendwave|dahabshiil/i],
 ["Education",/uwl|university|book|udemy|tryhackme|hack ?the ?box|coursera|ine\b|comptia|pearson/i],
 ["Health",/pharmacy|chemist|dentist|optician|nhs/i]
];
const guessCat=t=>{for(const[c,r] of CAT_RULES) if(r.test(t)) return c; return "Other";};
const BANK_COLORS=["#5b3a9e","#e0533d","#1f8f8a","#d4a017","#3366cc","#c2185b","#558b2f","#6d4c41"];

/* ---------- state ---------- */
const defaultNotify=()=>({due:true,weekly:true,over:true,pay:true,daysBefore:3});
const EMPTY=()=>({goal:1000,income:0,bills:0,payday:0,accounts:[],subs:[],debts:[],goals:[],months:{},notify:defaultNotify(),lastOverWeek:"",lastCheckin:""});
let real=EMPTY();
let demo=null;
let usingDemo=false;
let tab="overview";
let txFilter={acct:"all",month:monthKey(today())};
let storeMode="loading"; // db | local | loading
let loaded=false;
let installHintHidden=false;
const isStandalone=()=>{try{return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;}catch(e){return false;}};
const S=()=>usingDemo?demo:real;

/* ---------- storage: on this phone only ---------- */
const LS_KEY="fintracker-v1";
function lsLoad(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function saveAll(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(real));}catch(e){toast("Couldn't save. Your phone storage may be full.");}
  mirrorForReminders();
}
const persistSettings=()=>saveAll();
const persistMonth=()=>saveAll();
async function mirrorForReminders(){
  try{if(!("caches" in window))return;const c=await caches.open("fintracker-state");
    await c.put("./__state.json",new Response(JSON.stringify(real),{headers:{"content-type":"application/json"}}));}catch(e){}
}
function initStore(){
  storeMode="local";
  const d=lsLoad(); if(d) real=Object.assign(EMPTY(),d);
  real.debts=real.debts||[]; real.notify=Object.assign(defaultNotify(),real.notify||{});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  mirrorForReminders();
  finishLoad();
}
function finishLoad(){
  loaded=true;setTimeout(maybeCheckin,600);
  const empty=!real.accounts.length&&!real.subs.length&&!(real.debts||[]).length&&!Object.keys(real.months).length;
  if(empty&&!usingDemo&&!demoDismissed){usingDemo=true;demo=makeDemo();}
  if(!empty&&usingDemo){usingDemo=false;demo=null;}
  render();
}
let demoDismissed=false;
function leaveDemo(){if(usingDemo){usingDemo=false;demo=null;demoDismissed=true;}}

/* ---------- demo data ---------- */
function makeDemo(){
  const s=EMPTY(); s.income=1650; s.bills=260;
  s.accounts=[{id:"a1",name:"Monzo",color:BANK_COLORS[0]},{id:"a2",name:"Barclays",color:BANK_COLORS[1]},{id:"a3",name:"Starling",color:BANK_COLORS[2]}];
  const t=today();
    s.subs=[
    {id:"s1",name:"Spotify",amount:11.99,cycle:"monthly",start:iso(addDays(t,-25)),acct:"a1",active:true},
    {id:"s2",name:"iCloud storage",amount:2.99,cycle:"monthly",start:iso(addDays(t,-27)),acct:"a1",active:true},
    {id:"s3",name:"Gym membership",amount:24.99,cycle:"monthly",start:iso(addDays(t,-20)),acct:"a2",active:true},
    {id:"s4",name:"Amazon Prime",amount:8.99,cycle:"monthly",start:iso(addDays(t,-10)),acct:"a2",active:true},
    {id:"s5",name:"Phone plan",amount:10,cycle:"monthly",start:iso(addDays(t,-3)),acct:"a3",active:true},
    {id:"s6",name:"Cloud lab credits",amount:5,cycle:"weekly",start:iso(addDays(t,-6)),acct:"a1",active:true}
  ];
  s.debts=[
    {id:"d1",name:"Personal loan (example)",match:"loan",original:3000,balance:2240,monthly:110,rate:15,start:iso(addDays(t,4)),acct:"a2"},
    {id:"d2",name:"Buy now pay later (example)",match:"klarna",original:240,balance:80,monthly:80,rate:0,start:iso(addDays(t,9)),acct:"a1"}
  ];
  const rows=[
    [-1,"Tesco",23.40,"a1"],[-1,"TfL travel",6.80,"a1"],[-2,"Greggs",4.15,"a1"],[-3,"Deliveroo",18.90,"a1"],[-3,"Phone plan",10,"a3"],
    [-4,"Lidl",17.62,"a2"],[-5,"Shell petrol",35,"a2"],[-6,"Cloud lab credits",5,"a1"],[-7,"Costa",3.95,"a1"],[-8,"Amazon",14.99,"a2"],
    [-9,"Aldi",21.30,"a3"],[-10,"Amazon Prime",8.99,"a2"],[-11,"Nando's",16.50,"a1"],[-12,"TfL travel",8.10,"a1"],[-13,"Cloud lab credits",5,"a1"],
    [-14,"Remitly to family",120,"a3"],[-15,"Sainsbury's",28.75,"a1"],[-16,"Primark",22,"a2"],[-18,"Just Eat",14.20,"a1"],[-19,"Shell petrol",30,"a2"],
    [-20,"Gym membership",24.99,"a2"],[-20,"Cloud lab credits",5,"a1"],[-22,"Tesco",19.80,"a1"],[-24,"KFC",9.49,"a1"],[-25,"Spotify",11.99,"a1"],
    [-26,"Lidl",24.10,"a2"],[-27,"iCloud storage",2.99,"a1"],[-27,"Cloud lab credits",5,"a1"],[-29,"TfL travel",12.40,"a1"],[-31,"Deliveroo",21.60,"a1"],
    [-33,"Aldi",18.25,"a3"],[-35,"Uber Eats",15.80,"a1"],[-36,"Shell petrol",32,"a2"],[-38,"Tesco",26.90,"a1"],[-40,"Amazon Prime",8.99,"a2"],
    [-41,"Remitly to family",120,"a3"],[-43,"Greggs",5.20,"a1"],[-45,"Sainsbury's",31.10,"a1"],[-48,"Argos",19.99,"a2"],[-50,"Gym membership",24.99,"a2"],
    [-52,"Lidl",20.40,"a2"],[-55,"Spotify",11.99,"a1"]
  ];
  const push=tx=>{const k=tx.d.slice(0,7);(s.months[k]=s.months[k]||[]).push(tx);};
  rows.forEach(([o,n,a,ac])=>push({id:uid(),d:iso(addDays(t,o)),amt:a,kind:"spend",acct:ac,cat:guessCat(n),note:n}));
  const ms=new Date(t.getFullYear(),t.getMonth(),1);
  push({id:uid(),d:iso(ms),amt:300,kind:"save",acct:"a1",cat:"Savings",note:"Moved to savings pot"});
  push({id:uid(),d:iso(ms),amt:1650,kind:"income",acct:"a1",cat:"Income",note:"Monthly income"});
  return s;
}

/* ---------- derived ---------- */
function allTx(st){return Object.values(st.months).flat();}
function goalSaved(st,g){return Math.round(((g.startSaved||0)+allTx(st).filter(x=>x.kind==="save"&&x.goalId===g.id).reduce((a,b)=>a+b.amt,0))*100)/100;}
function activeGoals(st){return (st.goals||[]).filter(g=>goalSaved(st,g)<g.target-0.005);}
function goalOf(st){const gs=activeGoals(st);return (st.goals||[]).length?Math.round(gs.reduce((a,g)=>a+(g.monthly||0),0)*100)/100:(st.goal||0);}
function goalEta(st,g,monthly){const left=g.target-goalSaved(st,g);if(left<=0)return {n:0,label:"Reached"};const m=monthly??g.monthly;if(!(m>0))return {n:Infinity,label:"No monthly amount set"};const n=Math.ceil(left/m-1e-9);return {n,label:monthsFromNow(n)};}
function monthsBetween(toIso){const t=today(),d=parseISO(toIso);return (d.getFullYear()-t.getFullYear())*12+(d.getMonth()-t.getMonth());}
function acctById(st,id){return st.accounts.find(a=>a.id===id)||{name:"No bank",color:"#888"};}
function subMonthly(x){return x.cycle==="weekly"?x.amount*WEEKS_PER_MONTH:x.cycle==="yearly"?x.amount/12:x.amount;}
function addCycle(d,cycle,n){const x=new Date(d);if(cycle==="weekly")x.setDate(x.getDate()+7*n);else if(cycle==="yearly")x.setFullYear(x.getFullYear()+n);else{const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);x.setDate(Math.min(day,daysInMonth(x)));}return x;}
function nextDue(x,from){const a=parseISO(x.start);let n=0,d=a;while(d<from&&n<2000){n++;d=addCycle(a,x.cycle,n);}return d;}
function dueBetween(x,from,to){const out=[];const a=parseISO(x.start);for(let n=0;n<600;n++){const d=addCycle(a,x.cycle,n);if(d>to)break;if(d>=from)out.push(d);}return out;}
const FIXED=new Set(["Subscriptions","Bills","Debt repayment"]);
function calc(st){
  const t=today(), ms=new Date(t.getFullYear(),t.getMonth(),1), me=new Date(t.getFullYear(),t.getMonth()+1,0);
  const txs=allTx(st);
  const thisMonth=txs.filter(x=>x.d.slice(0,7)===monthKey(t));
  const spentMonth=thisMonth.filter(x=>x.kind==="spend").reduce((a,b)=>a+b.amt,0);
  const savedMonth=thisMonth.filter(x=>x.kind==="save").reduce((a,b)=>a+b.amt,0);
  const activeSubs=st.subs.filter(x=>x.active!==false);
  const subsMonthly=activeSubs.reduce((a,b)=>a+subMonthly(b),0);
  const debts=st.debts||[];
  const activeDebts=debts.filter(x=>x.balance>0.005);
  const debtMonthly=activeDebts.reduce((a,b)=>a+Math.min(b.monthly||0,b.balance),0);
  const debtOwed=activeDebts.reduce((a,b)=>a+b.balance,0);
  const debtDue=activeDebts.filter(x=>x.start).map(x=>({x,d:nextDue({start:x.start,cycle:"monthly"},t)})).sort((a,b)=>a.d-b.d);
  const flexMonthly=st.income-st.bills-subsMonthly-debtMonthly-goalOf(st);
  const flexWeekly=flexMonthly/WEEKS_PER_MONTH;
  const ws=weekStart(t);
  const weeks=[];for(let i=7;i>=0;i--){const s=addDays(ws,-7*i),e=addDays(s,6);const inW=txs.filter(x=>x.kind==="spend"&&parseISO(x.d)>=s&&parseISO(x.d)<=e);weeks.push({s,e,total:inW.reduce((a,b)=>a+b.amt,0),flex:inW.filter(x=>!FIXED.has(x.cat)).reduce((a,b)=>a+b.amt,0)});}
  const thisWeek=weeks[weeks.length-1];
  const daysLeft=Math.round((me-t)/DAY)+1;
  const upcoming=activeSubs.map(x=>({x,d:nextDue(x,t)})).sort((a,b)=>a.d-b.d);
  const catMonth={};thisMonth.filter(x=>x.kind==="spend").forEach(x=>catMonth[x.cat]=(catMonth[x.cat]||0)+x.amt);
  const lastM=new Date(t.getFullYear(),t.getMonth()-1,1);
  const lastSamePeriod=txs.filter(x=>x.kind==="spend"&&x.d.slice(0,7)===monthKey(lastM)&&parseISO(x.d).getDate()<=t.getDate());
  const catLast={};lastSamePeriod.forEach(x=>catLast[x.cat]=(catLast[x.cat]||0)+x.amt);
  const bankMonth={};thisMonth.filter(x=>x.kind==="spend").forEach(x=>bankMonth[x.acct]=(bankMonth[x.acct]||0)+x.amt);
  return {t,ms,me,txs,activeDebts,debtMonthly,debtOwed,debtDue,spentMonth,savedMonth,activeSubs,subsMonthly,flexMonthly,flexWeekly,weeks,thisWeek,daysLeft,upcoming,catMonth,catLast,bankMonth};
}
function payoff(B,P,apr){
  if(!(B>0))return {n:0,interest:0};
  if(!(P>0))return {n:Infinity,interest:Infinity};
  const r=(apr||0)/100/12;
  if(r===0)return {n:Math.ceil(B/P-1e-9),interest:0};
  if(P<=B*r)return {n:Infinity,interest:Infinity};
  const n=Math.ceil(-Math.log(1-r*B/P)/Math.log(1+r)-1e-9);
  let bal=B,paid=0;for(let i=0;i<n&&bal>0.005;i++){bal=bal*(1+r);const pay=Math.min(P,bal);bal-=pay;paid+=pay;}
  return {n,interest:Math.max(0,paid-B)};
}
const monthsFromNow=n=>{const d=today();d.setDate(1);d.setMonth(d.getMonth()+n);return d.toLocaleDateString("en-GB",{month:"short",year:"numeric"});};
function detectRecurring(st){
  const groups={};
  allTx(st).filter(x=>x.kind==="spend").forEach(x=>{const k=x.note.toLowerCase().replace(/[0-9#*]+/g,"").replace(/\s+/g," ").trim().slice(0,28);if(!k)return;(groups[k]=groups[k]||[]).push(x);});
  const have=st.subs.map(s=>s.name.toLowerCase());
  const out=[];
  for(const[k,list] of Object.entries(groups)){
    const months=new Set(list.map(x=>x.d.slice(0,7)));
    if(months.size<2)continue;
    const amts=list.map(x=>x.amt);const avg=amts.reduce((a,b)=>a+b,0)/amts.length;
    if(amts.some(a=>Math.abs(a-avg)>avg*0.1+0.5))continue;
    if(have.some(h=>h&&(k.includes(h.slice(0,6))||h.includes(k.slice(0,6)))))continue;
    const last=list.map(x=>x.d).sort().pop();
    const sorted=list.map(x=>parseISO(x.d)).sort((a,b)=>a-b);
    const gaps=[];for(let i=1;i<sorted.length;i++)gaps.push((sorted[i]-sorted[i-1])/DAY);
    const g=gaps.length?gaps.reduce((a,b)=>a+b,0)/gaps.length:30;
    const cycle=g<10?"weekly":g>200?"yearly":"monthly";
    out.push({name:list[0].note,amount:Math.round(avg*100)/100,cycle,last,acct:list[list.length-1].acct,count:list.length});
  }
  return out.sort((a,b)=>b.amount-a.amount).slice(0,6);
}

/* ---------- render ---------- */
function render(){
  const st=S();
  $("#monthLabel").textContent=today().toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));
  let ban="";
  if(!loaded) ban=`<div class="banner"><span>Opening your ledger…</span></div>`;
  else if(usingDemo) ban=`<div class="banner"><span><strong>Example data.</strong> These banks and figures are made up to show how it works. Add your own bank to start.</span><span class="row"><button class="btn sm primary" data-act="start-real" type="button">Start with my own</button></span></div>`;
  if(!isStandalone()&&!installHintHidden) ban+=`<div class="banner"><span><strong>Install the app:</strong> in Safari tap the Share button, then <strong>Add to Home Screen</strong>. Notifications only work from the home-screen app.</span><button class="btn sm ghost" data-act="hide-install" type="button">Hide</button></div>`;
  $("#banner").innerHTML=ban;
  const c=calc(st);
  const v=$("#view");
  if(tab==="overview")v.innerHTML=viewOverview(st,c);
  else if(tab==="spending")v.innerHTML=viewSpending(st,c);
  else if(tab==="subs")v.innerHTML=viewSubs(st,c);
  else if(tab==="banks")v.innerHTML=viewBanks(st,c);
  else if(tab==="debts")v.innerHTML=viewDebts(st,c);
  else if(tab==="goals")v.innerHTML=viewGoals(st,c);
  else v.innerHTML=viewPlan(st,c);
}

function statusFor(spent,budget){if(budget<=0)return["bad","No room left"];const r=spent/budget;if(r>1)return["bad","Over budget"];if(r>0.8)return["warn","Getting close"];return["good","On track"];}

function viewOverview(st,c){
  const pct=goalOf(st)>0?Math.min(100,c.savedMonth/goalOf(st)*100):0;

    `<strong class="num">${gbp(need)}</strong> still to put aside in the next ${c.daysLeft} day${c.daysLeft===1?"":"s"} — about <strong class="num">${gbp(need/weeksLeft)}</strong> a week.`;
  const [cls,lab]=statusFor(c.thisWeek.flex,c.flexWeekly);
  const wpct=c.flexWeekly>0?Math.min(100,c.thisWeek.flex/c.flexWeekly*100):100;
  const due=c.upcoming.filter(u=>(u.d-c.t)/DAY<=14).map(u=>({...u,type:"sub"})).concat(c.debtDue.filter(u=>(u.d-c.t)/DAY<=14).map(u=>({...u,type:"debt"}))).sort((a,b)=>a.d-b.d);
  const urgentDebt=c.debtDue.filter(u=>(u.d-c.t)/DAY<=3);
  const banks=st.accounts.map(a=>({a,v:c.bankMonth[a.id]||0}));
  const bankMax=Math.max(1,...banks.map(b=>b.v));
  return `<div class="stack">
  ${urgentDebt.map(u=>{const days=Math.round((u.d-c.t)/DAY);return `<div class="banner" style="border-color:var(--warn);background:var(--warn-soft)"><span><strong>${esc(u.x.name)}</strong> payment of <span class="num">${gbp2(Math.min(u.x.monthly,u.x.balance))}</span> is due ${days===0?"today":days===1?"tomorrow":"in "+days+" days"} from ${esc(acctById(st,u.x.acct).name)}. Make sure the money is there.</span><button class="btn sm" data-act="pay-debt" data-id="${esc(u.x.id)}" type="button">Record payment</button></div>`;}).join("")}
  <section class="goal" aria-label="Savings goal">
    <div class="row" style="justify-content:space-between"><span class="label">Saved this month</span><button class="btn sm ghost" data-tab-go="plan" type="button">Change goal</button></div>
    <div class="big">${gbp(c.savedMonth)} <span class="muted" style="font-size:1rem;font-weight:500">of ${gbp(goalOf(st))}</span></div>
    <div class="meter${need<=0?" good":""}" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <p style="margin:10px 0 0">${goalMsg}</p>
    ${(st.goals||[]).length?`<div class="list" style="margin-top:10px">${(st.goals||[]).map(g=>{const sv=goalSaved(st,g),p=Math.min(100,sv/g.target*100);return `<div style="padding:6px 0"><div class="row" style="justify-content:space-between;gap:6px"><span style="font-weight:500;overflow-wrap:anywhere">${esc(g.name)}</span><span class="num small">${gbp(sv)} / ${gbp(g.target)}</span></div><div class="meter thin${p>=100?" good":""}" style="margin-top:4px"><i style="width:${p}%"></i></div></div>`;}).join("")}</div>`:`<p class="small muted" style="margin:8px 0 0">Saving for something specific? <button class="btn sm" data-tab-go="goals" type="button">Add a goal</button></p>`}
  </section>

  <section class="panel">
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><h2>This week</h2><span class="chip ${cls}">${lab}</span></div>
    <div class="row" style="align-items:baseline;gap:6px"><span class="num" style="font-size:1.6rem;font-family:var(--f-display);font-weight:700">${gbp2(c.thisWeek.flex)}</span><span class="muted">of ${c.flexWeekly>0?gbp(c.flexWeekly)+" day-to-day budget":"no budget left"}</span></div>
    <div class="meter thin ${cls}"><i style="width:${wpct}%"></i></div>
    <p class="small muted" style="margin:8px 0 0">${fmtShort(c.thisWeek.s)} – ${fmtShort(c.thisWeek.e)} · total incl. bills &amp; subs <span class="num">${gbp2(c.thisWeek.total)}</span></p>
    <div class="chartbox" style="margin-top:12px">${weekChart(c)}</div>
  </section>

  <div class="grid2">
    <section class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:6px"><h2>Due in the next 2 weeks</h2><button class="btn sm ghost" data-tab-go="subs" type="button">All ${c.activeSubs.length}</button></div>
      ${due.length?`<div class="list">${due.map(u=>u.type==="debt"?debtDueRow(st,u.x,u.d,c.t):subRow(st,u.x,u.d,c.t,false)).join("")}</div>`:`<div class="empty">Nothing due in the next 14 days.</div>`}
    </section>
    <section class="panel">
      <h2 style="margin-bottom:8px">Spent by bank this month</h2>
      ${banks.length?banks.map(b=>`<div class="catbar"><span class="row" style="gap:6px;flex-wrap:nowrap;min-width:0"><span class="dot" style="background:${esc(b.a.color)}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.a.name)}</span></span><span class="track"><i style="width:${b.v/bankMax*100}%;background:${esc(b.a.color)}"></i></span><span class="num">${gbp(b.v)}</span></div>`).join("")+`<p class="small muted" style="margin:8px 0 0">Total <span class="num">${gbp2(c.spentMonth)}</span> across ${banks.length} bank${banks.length===1?"":"s"}</p>`:`<div class="empty">Add your banks in <button class="btn sm" data-tab-go="banks" type="button">Banks &amp; import</button></div>`}
    </section>

  ${c.activeDebts.length?`<section class="panel"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h2>Debts</h2><button class="btn sm ghost" data-tab-go="debts" type="button">Open</button></div>
    <div class="row" style="align-items:baseline;gap:6px"><span class="num" style="font-size:1.4rem;font-family:var(--f-display);font-weight:700">${gbp2(c.debtOwed)}</span><span class="muted">owed across ${c.activeDebts.length} debt${c.activeDebts.length===1?"":"s"} · <span class="num">${gbp2(c.debtMonthly)}</span>/month</span></div>
    ${(()=>{const orig=c.activeDebts.reduce((a,b)=>a+(b.original||b.balance),0);const p=orig?Math.min(100,(1-c.debtOwed/orig)*100):0;return `<div class="meter thin good"><i style="width:${p}%"></i></div><p class="small muted" style="margin:6px 0 0">${Math.round(p)}% paid off</p>`;})()}
  </section>`:""}
  <section class="panel">
    <h2 style="margin-bottom:10px">Ways to find your ${gbp(goalOf(st))}</h2>
    <ul class="tips">${tips(st,c).map(t=>`<li>${t}</li>`).join("")}</ul>
  </section>
  </div>`;
}

function weekChart(c){
  const W=640,H=180,pl=44,pr=10,pt=14,pb=26;
  const vals=c.weeks.map(w=>w.flex);
  const budget=c.flexWeekly>0?c.flexWeekly:0;
  let max=Math.max(budget,...vals,10);
  const step=max<=60?10:max<=150?25:max<=300?50:max<=600?100:max<=1500?250:500;
  max=Math.ceil(max/step)*step;
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  const bw=(W-pl-pr)/vals.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px;display:block" role="img" aria-label="Day-to-day spending for the last 8 weeks">`;
  for(let v=0;v<=max;v+=step){s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">£${v}</text>`;}
  c.weeks.forEach((w,i)=>{const x=pl+i*bw+bw*0.18,bwid=bw*0.64,now=i===vals.length-1;const over=budget>0&&w.flex>budget;
    s+=`<rect x="${x}" y="${y(w.flex)}" width="${bwid}" height="${Math.max(0,y(0)-y(w.flex))}" rx="3" fill="${over?"var(--bad)":now?"var(--bar-now)":"var(--bar)"}"><title>${fmtShort(w.s)}: ${gbp2(w.flex)}</title></rect>`;
    s+=`<text x="${x+bwid/2}" y="${H-8}" text-anchor="middle">${now?"This wk":fmtShort(w.s)}</text>`;});
  if(budget>0){s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(budget)}" y2="${y(budget)}" stroke="var(--fg)" stroke-dasharray="5 4" stroke-width="1.2"/><text x="${W-pr}" y="${y(budget)-5}" text-anchor="end" style="fill:var(--fg)">budget ${gbp(budget)}</text>`;}
  return s+"</svg>";
}

function tips(st,c){
  const out=[];
  const costly=c.activeDebts.filter(x=>x.rate>0).sort((a,b)=>b.rate-a.rate)[0];
  if(costly){const base=payoff(costly.balance,costly.monthly,costly.rate),more=payoff(costly.balance,costly.monthly+50,costly.rate);
    if(isFinite(base.n)&&isFinite(more.n)&&base.n>more.n) out.push(`${esc(costly.name)} costs ${costly.rate}% a year. Paying <strong class="num">£50</strong> extra a month clears it about <strong>${base.n-more.n} month${base.n-more.n===1?"":"s"} sooner</strong> and saves roughly <strong class="num">${gbp(base.interest-more.interest)}</strong> in interest. Record it as an extra payment and it counts toward your savings goal.`);}
  const fixed=st.bills+c.subsMonthly+c.debtMonthly;
  if(!st.income){out.push(`Set your monthly income in <strong>Plan &amp; settings</strong> so the app can work out a weekly budget that still leaves ${gbp(goalOf(st))} to save.`);}
  else if(c.flexMonthly<0){
    const most=Math.max(0,st.income-fixed-c.weeks.slice(0,7).reduce((a,b)=>a+b.flex,0)/7*WEEKS_PER_MONTH);
    out.push(`With <span class="num">${gbp(st.income)}</span> coming in and <span class="num">${gbp(fixed)}</span> of bills, subscriptions and debt payments, a ${gbp(goalOf(st))} goal leaves nothing for food and travel. At your recent spending, about <strong class="num">${gbp(most)}</strong> a month is realistic. Start there and raise it as income grows.`);
  } else {
    out.push(`Move <strong class="num">${gbp(goalOf(st))}</strong> to a separate savings pot on the day your money comes in, then live on the <span class="num">${gbp(c.flexWeekly)}</span> a week that's left.`);
  }
  const subs=c.activeSubs.slice().sort((a,b)=>subMonthly(b)-subMonthly(a));
  if(subs.length>=2){const two=subs.slice(0,2);out.push(`Your ${c.activeSubs.length} subscriptions cost <span class="num">${gbp2(c.subsMonthly)}</span> a month (<span class="num">${gbp(c.subsMonthly*12)}</span> a year). Cancelling ${esc(two[0].name)} and ${esc(two[1].name)} would free <strong class="num">${gbp2(subMonthly(two[0])+subMonthly(two[1]))}</strong> a month.`);}
  const eo=c.catMonth["Eating out"]||0;
  if(eo>15) out.push(`Eating out and takeaways: <span class="num">${gbp2(eo)}</span> so far this month. Halving it adds about <strong class="num">${gbp(eo/2/(c.t.getDate())*daysInMonth(c.t))}</strong> to savings by month end.`);
  let worst=null;for(const[k,v] of Object.entries(c.catMonth)){if(FIXED.has(k))continue;const l=c.catLast[k]||0;if(l>0&&v-l>10&&(!worst||v-l>worst.d))worst={k,d:v-l,v,l};}
  if(worst) out.push(`${esc(worst.k)} is up <strong class="num">${gbp(worst.d)}</strong> on the same point last month (<span class="num">${gbp(worst.v)}</span> vs <span class="num">${gbp(worst.l)}</span>).`);
  if(out.length<3) out.push(`Import a statement (PDF or CSV) from each bank so every payment is counted. Recurring payments are spotted automatically on the Subscriptions tab.`);
  return out.slice(0,4);
}

function subRow(st,x,d,t,full){
  const days=Math.round((d-t)/DAY);
  const chip=days===0?`<span class="chip bad">Today</span>`:days<=3?`<span class="chip warn">In ${days} day${days===1?"":"s"}</span>`:`<span class="chip plain">${fmtShort(d)}</span>`;
  const a=acctById(st,x.acct);
  const per=x.cycle==="weekly"?"/wk":x.cycle==="yearly"?"/yr":"/mo";
  return `<div class="item"><span class="dot" style="background:${esc(a.color)}"></span><div class="main"><div class="name">${esc(x.name)}${x.active===false?' <span class="chip plain">Cancelled</span>':""}</div><div class="small muted">${esc(a.name)} · ${x.active===false?"no more payments":chip}</div></div><div class="amt">${gbp2(x.amount)}<span class="muted small">${per}</span>${full?`<div class="row" style="justify-content:flex-end;margin-top:4px"><button class="btn sm ghost" data-act="edit-sub" data-id="${esc(x.id)}" type="button">Edit</button></div>`:""}</div></div>`;
}

function debtDueRow(st,x,d,t){
  const days=Math.round((d-t)/DAY);
  const chip=days===0?`<span class="chip bad">Today</span>`:days<=3?`<span class="chip warn">In ${days} day${days===1?"":"s"}</span>`:`<span class="chip plain">${fmtShort(d)}</span>`;
  const a=acctById(st,x.acct);
  return `<div class="item"><span class="dot" style="background:${esc(a.color)}"></span><div class="main"><div class="name">${esc(x.name)} <span class="chip plain">Debt</span></div><div class="small muted">${esc(a.name)} · ${chip}</div></div><div class="amt">${gbp2(Math.min(x.monthly,x.balance))}</div></div>`;
}
function viewDebts(st,c){
  const debts=(st.debts||[]).slice();
  const active=c.debtDue.slice().concat(c.activeDebts.filter(x=>!x.start).map(x=>({x,d:null})));
  const cleared=debts.filter(x=>!(x.balance>0.005));
  const orig=debts.reduce((a,b)=>a+(b.original||b.balance||0),0);
  const paid=debts.reduce((a,b)=>a+Math.max(0,(b.original||b.balance)-b.balance),0);
  const row=u=>{const x=u.x;const a=acctById(st,x.acct);const p=x.original?Math.min(100,(1-x.balance/x.original)*100):0;const po=payoff(x.balance,x.monthly,x.rate);
    const days=u.d?Math.round((u.d-c.t)/DAY):null;
    const chip=u.d==null?`<span class="chip plain">No date set</span>`:days===0?`<span class="chip bad">Due today</span>`:days<=3?`<span class="chip warn">Due in ${days} day${days===1?"":"s"}</span>`:`<span class="chip plain">Next ${fmtShort(u.d)}</span>`;
    const clear=po.n===Infinity?`<span style="color:var(--bad)">The monthly payment doesn't cover the interest, so this won't clear.</span>`:`Clear by about <strong>${monthsFromNow(po.n)}</strong>${po.interest>0.5?` · about <span class="num">${gbp(po.interest)}</span> more interest`:""}`;
    return `<div class="panel" style="padding:14px">

function notifyPanel(st){
  const n=Object.assign(defaultNotify(),st.notify||{});
  const supported="Notification" in window&&"serviceWorker" in navigator;
  const perm=supported?Notification.permission:"unsupported";
  let status;
  if(!isStandalone()) status=`<p style="margin:0 0 10px">First add the app to your home screen (Safari → Share → <strong>Add to Home Screen</strong>), then open it from there to turn on notifications.</p>`;
  else if(!supported) status=`<p style="margin:0 0 10px">This phone doesn't support web notifications. Update to iOS 16.4 or later.</p>`;
  else if(perm==="granted") status=`<p style="margin:0 0 10px"><span class="chip good">On</span> Notifications are allowed. <button class="btn sm ghost" data-act="test-notify" type="button">Send a test</button></p>`;
  else if(perm==="denied") status=`<p style="margin:0 0 10px"><span class="chip bad">Blocked</span> Turn them on in iPhone Settings → Notifications → Fintracker.</p>`;
  else status=`<p style="margin:0 0 10px"><button class="btn primary" data-act="enable-notify" type="button">Turn on notifications</button></p>`;
  const t=(id,on,label,sub)=>`<label class="toggle" for="${id}"><input type="checkbox" id="${id}"${on?" checked":""}><span><strong>${label}</strong><br><span class="small muted">${sub}</span></span></label>`;
  return `<section class="panel">
    <h2 style="margin-bottom:8px">Notifications</h2>
    ${status}
    ${t("nOver",n.over,"Over budget","As soon as this week's day-to-day spending goes over budget.")}
    ${t("nDue",n.due,"Payments due","Debts and subscriptions, "+n.daysBefore+" days before and on the day.")}
    ${t("nWeekly",n.weekly,"Sunday summary","What you spent this week against your budget.")}
    ${t("nPay",n.pay,"Payday goal check-in","On payday: how far you've got with each goal, and how much to put aside this month.")}
    <div class="field" style="margin-top:10px"><label for="pPayday">Day of the month your money comes in</label><input id="pPayday" inputmode="numeric" value="${st.payday||""}" placeholder="e.g. 15"></div>
    <p class="small muted" style="margin:0">Over-budget alerts work now. Payment, Sunday and payday reminders start once the reminder server is connected.</p>
  </section>`;
}
async function notify(title,body,tag){
  try{
    if(!("Notification" in window)||Notification.permission!=="granted")return false;
    const reg=("serviceWorker" in navigator)?await navigator.serviceWorker.ready:null;
    const opts={body,tag,icon:"icon-192.png",badge:"icon-192.png"};
    if(reg){await reg.showNotification(title,opts);return true;}
    new Notification(title,opts);return true;
  }catch(e){return false;}
}
function checkOverBudget(){
  if(usingDemo)return;
  const c=calc(real);if(!(c.flexWeekly>0))return;
  const wk=iso(c.thisWeek.s);
  if(c.thisWeek.flex>c.flexWeekly&&real.lastOverWeek!==wk){
    real.lastOverWeek=wk;saveAll();
    const msg=`You've spent ${gbp2(c.thisWeek.flex)} this week against a ${gbp(c.flexWeekly)} budget. Hold off on extras until Monday.`;
    toast("Over this week's budget");
    if(real.notify&&real.notify.over)notify("Over this week's budget",msg,"over");
  }
}
function downloadBackup(){
  const blob=new Blob([JSON.stringify({app:"fintracker",version:1,saved:new Date().toISOString(),data:real},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="fintracker-backup-"+iso(today())+".json";
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
}
function restoreBackup(file){
  const r=new FileReader();r.onload=()=>{
    let parsed;try{parsed=JSON.parse(String(r.result));}catch(e){toast("That file isn't a Fintracker backup.");return;}
    const d=parsed&&parsed.data;if(!d||!Array.isArray(d.accounts)||typeof d.months!=="object"){toast("That file isn't a Fintracker backup.");return;}
    openSheet(`<div><h2 style="margin-bottom:8px">Restore backup?</h2><p style="margin:0 0 12px">This replaces everything on this phone with the backup from ${esc((parsed.saved||"").slice(0,10)||"an unknown date")}.</p><div class="row" style="justify-content:flex-end"><button class="btn" type="button" id="rNo">Cancel</button><button class="btn primary" type="button" id="rYes">Replace and restore</button></div></div>`,()=>{
      $("#rNo").onclick=closeSheet;
      $("#rYes").onclick=()=>{leaveDemo();real=Object.assign(EMPTY(),d);real.debts=real.debts||[];real.notify=Object.assign(defaultNotify(),real.notify||{});saveAll();closeSheet();render();toast("Backup restored");};
    });
  };r.readAsText(file);
}
function yearSaved(st,c){
  const y=c.t.getFullYear();let total=0;const rows=[];
  for(let m=0;m<=c.t.getMonth();m++){const k=y+"-"+pad(m+1);const v=(st.months[k]||[]).filter(x=>x.kind==="save").reduce((a,b)=>a+b.amt,0);total+=v;rows.push([k,v]);}
  return rows.reverse().map(([k,v])=>{const p=goalOf(st)?Math.min(100,v/goalOf(st)*100):0;return `<div class="catbar"><span>${parseISO(k+"-01").toLocaleDateString("en-GB",{month:"short"})}</span><span class="track"><i style="width:${p}%;background:${v>=goalOf(st)?"var(--good)":"var(--bar-now)"}"></i></span><span class="num">${gbp(v)}</span></div>`;}).join("")+`<p class="small muted" style="margin:8px 0 0">Total saved in ${y}: <strong class="num">${gbp2(total)}</strong></p>`;
}

function openSheet(html,onMount){
  $("#sheetRoot").innerHTML=`<div class="sheet-bg" id="sheetBg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#sheetBg").addEventListener("click",e=>{if(e.target.id==="sheetBg")closeSheet();});
  const first=$("#sheetRoot input,#sheetRoot select");if(first)first.focus();
  onMount&&onMount();
}
function closeSheet(){$("#sheetRoot").innerHTML="";}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});
function toast(msg){$("#toastRoot").innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$("#toastRoot").innerHTML="",2400);}
const money=v=>{const n=parseFloat(String(v).replace(/[£,\s]/g,""));return isFinite(n)?Math.round(n*100)/100:NaN;};
function acctOptions(st,sel){return st.accounts.length?st.accounts.map(a=>`<option value="${esc(a.id)}"${a.id===sel?" selected":""}>${esc(a.name)}</option>`).join(""):`<option value="">Add a bank first</option>`;}
function seg(name,opts,val){return `<div class="seg" data-seg="${name}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${v===val}">${l}</button>`).join("")}</div>`;}
function bindSeg(){document.querySelectorAll("#sheetRoot .seg").forEach(s=>s.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;s.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));s.dataset.val=b.dataset.v;s.dispatchEvent(new Event("change"));}));}
const segVal=n=>{const b=document.querySelector(`#sheetRoot .seg[data-seg="${n}"] button[aria-pressed="true"]`);return b?b.dataset.v:null;};

  });
}

/* ---------- CSV import ---------- */
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
    else if(ch==='"')q=true;else if(ch===","){row.push(f);f="";}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f="";}else f+=ch;}
  if(f||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function parseDate(s){s=(s||"").trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+"-"+pad(+m[2])+"-"+pad(+m[3]);
  if(m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/)){let y=+m[3];if(y<100)y+=2000;return y+"-"+pad(+m[2])+"-"+pad(+m[1]);}
  if(m=s.match(/^(\d{1,2})[\s-]([A-Za-z]{3})[A-Za-z]*[\s-](\d{2,4})/)){let y=+m[3];if(y<100)y+=2000;const mo=MON[m[2].toLowerCase()];if(mo)return y+"-"+pad(mo)+"-"+pad(+m[1]);}
  return null;}
function findCol(h,res){for(const r of res){const i=h.findIndex(x=>r.test(x));if(i>=0)return i;}return -1;}
/* ---- CSV → items ---- */
function csvItems(text){
  const rows=parseCSV(text);
  const hi=rows.findIndex(rw=>rw.some(c=>/date/i.test(c)));
  if(hi<0)return {error:`Couldn't find a "Date" column. Check this is the transactions file from your bank.`};
  const h=rows[hi].map(x=>x.trim().toLowerCase());
  const cDate=findCol(h,[/^date$/,/transaction date/,/date/]);
  const cDesc=findCol(h,[/^name$/,/description/,/merchant/,/payee/,/details/,/narrative/,/memo/,/reference/,/counter ?party/]);
  const cAmt=findCol(h,[/^amount$/,/amount/,/^value$/]);
  const cOut=findCol(h,[/paid out/,/money out/,/debit/,/^out$/,/withdrawal/]);
  const cIn=findCol(h,[/paid in/,/money in/,/credit/,/^in$/,/deposit/]);
  const cCat=findCol(h,[/^category$/,/category/]);
  if(cAmt<0&&cOut<0)return {error:"Couldn't find an amount column (looked for Amount, Paid out, Debit)."};
  const items=[];let skipped=0;
  rows.slice(hi+1).forEach(rw=>{const d=parseDate(rw[cDate]);if(!d){skipped++;return;}
    let v;if(cAmt>=0&&cOut<0)v=money(rw[cAmt]);else{const o=money(rw[cOut]),i=cIn>=0?money(rw[cIn]):NaN;v=(i>0?i:0)-(o>0?o:0);if(!(o>0)&&!(i>0)&&cAmt>=0)v=money(rw[cAmt]);}
    if(!isFinite(v)||v===0){skipped++;return;}
    items.push({d,v,note:(cDesc>=0?rw[cDesc]:"").trim().replace(/\s{2,}/g," ").slice(0,80),bankCat:cCat>=0?(rw[cCat]||"").toLowerCase():""});});
  return {items,skipped,flippable:true};
}

/* ---- PDF → items (read on this phone with pdf.js) ---- */
let pdfjsPromise=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(!pdfjsPromise)pdfjsPromise=new Promise((res,rej)=>{const s=document.createElement("script");s.src="vendor/pdf.min.js";
    s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc="vendor/pdf.worker.min.js";res(window.pdfjsLib);}catch(e){rej(e);}};
    s.onerror=()=>{pdfjsPromise=null;rej(new Error("load"));};document.head.appendChild(s);});
  return pdfjsPromise;
}
const AMT_RE=/^\(?-?£?\s?\d{1,3}(?:,\d{3})*\.\d{2}\)?(?:\s?(?:CR|DR|D|C|-))?$/i;
const TYPE_CODES=/\s+(DEB|DD|SO|FPO|FPI|BGC|CPT|TFR|CHG|BP|DEP|PAY|CR|DR|COR|FEE|INT|CSH|ATM|POS|BAC|D\/D|S\/O)$/i;
function amtVal(s){const neg=/^\(|\)$|-$|^-|DR$|D$/i.test(s.trim())&&!/CR$|C$/i.test(s.trim());const n=parseFloat(s.replace(/[^0-9.]/g,""));return {n,neg};}
const MONTHS3="jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec";
const LEAD_DATE=new RegExp("^(\\d{1,2}[\\/.-]\\d{1,2}[\\/.-]\\d{2,4}|\\d{4}-\\d{2}-\\d{2}|\\d{1,2}(?:st|nd|rd|th)?[\\s-](?:"+MONTHS3+")[a-z]*\\.?(?:[\\s-]\\d{2,4})?)\\b","i");
function pdfDate(s,docYear){
  let d=parseDate(s.replace(/(\d)(st|nd|rd|th)/i,"$1").replace(/\./g,""));if(d)return d;
  const m=s.match(new RegExp("^(\\d{1,2})(?:st|nd|rd|th)?[\\s-]("+MONTHS3+")","i"));
  if(m){const mo=MON[m[2].toLowerCase()];let dt=new Date(docYear,mo-1,+m[1]);if(dt>addDays(today(),2))dt=new Date(docYear-1,mo-1,+m[1]);return iso(dt);}
  return null;
}
async function pdfItems(buf){
  const lib=await loadPdfJs();
  let doc;
  try{doc=await lib.getDocument({data:buf,isEvalSupported:false}).promise;}
  catch(e){if(e&&e.name==="PasswordException")return {error:"This PDF has a password. Download it again without one, or use the CSV."};return {error:"Couldn't open this PDF."};}
  const lines=[];let allText="";
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p);const tc=await page.getTextContent();
    const its=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({x:i.transform[4],y:i.transform[5],w:i.width||0,s:i.str.trim()}));
    its.sort((a,b)=>b.y-a.y||a.x-b.x);
    let cur=null;
    for(const it of its){if(cur&&Math.abs(cur.y-it.y)<=3){cur.items.push(it);}else{cur={y:it.y,page:p,items:[it]};lines.push(cur);}}
    allText+=its.map(i=>i.s).join(" ")+" ";
  }
  if(allText.trim().length<20)return {error:"This PDF looks like a scanned picture, so there's no text to read. Use the CSV from online banking instead."};
  const years={};(allText.match(/\b20\d{2}\b/g)||[]).forEach(y=>years[y]=(years[y]||0)+1);
  let docYear=today().getFullYear();const ys=Object.keys(years).map(Number).filter(y=>y<=docYear+1);if(ys.length)docYear=Math.max(...ys);
  let cols=null,lastDate=null,prevBal=null;const items=[];let skipped=0,unsure=0;
  for(const ln of lines){
    ln.items.sort((a,b)=>a.x-b.x);
    // split items that glue words and an amount together, e.g. "TESCO 23.40"
    const parts=[];ln.items.forEach(it=>{const bits=it.s.split(/\s{2,}/);if(bits.length===1){parts.push(it);return;}let x=it.x;const cw=it.w/Math.max(1,it.s.length);bits.forEach(b=>{parts.push({x,y:it.y,w:b.length*cw,s:b.trim()});x+=(b.length+2)*cw;});});
    const text=parts.map(p=>p.s).join(" ");const low=text.toLowerCase();
    // header row: remember where the money-out / money-in / balance columns are
    if(/balance/.test(low)&&/(out|debit|withdraw|payments?|paid)/.test(low)&&/(\bin\b|credit|deposit|receipts?|paid in)/.test(low)&&!AMT_RE.test(parts[parts.length-1].s)){
      const c={};parts.forEach(p=>{const l=p.s.toLowerCase();const r=p.x+p.w;
        if(/balance/.test(l))c.bal=r;else if(/out|debit|withdraw|payments?(?! in)|paid out/.test(l))c.out=r;else if(/\bin\b|credit|deposit|receipt/.test(l))c.in=r;});
      if(c.out!=null||c.in!=null)cols=c;continue;}
    const amts=parts.filter(p=>AMT_RE.test(p.s));
    if(/brought forward|opening balance|balance b\/f|previous balance|start balance|balance from/i.test(low)){if(amts.length){const a=amtVal(amts[amts.length-1].s);prevBal=a.neg?-a.n:a.n;}continue;}
    if(/carried forward|closing balance|balance c\/f|end balance|^total|total (payments|receipts|money|paid)/i.test(low))continue;
    const m=text.match(LEAD_DATE);
    let d=m?pdfDate(m[1],docYear):null;
    if(!amts.length){continue;}
    if(d)lastDate=d;else if(lastDate&&!/^\d/.test(text))d=lastDate;else{skipped++;continue;}
    const firstAmtX=amts[0].x;
    let desc=parts.filter(p=>p.x<firstAmtX&&!AMT_RE.test(p.s)).map(p=>p.s).join(" ");
    if(m)desc=desc.replace(LEAD_DATE,"").trim();
    desc=desc.replace(TYPE_CODES,"").replace(/^(DEB|DD|SO|FPO|FPI|BGC|CPT|TFR|BP|DEP)\s+/i,"").replace(/\s{2,}/g," ").trim().slice(0,80);
    let v=null,bal=null;
    if(cols){
      let outAmt=null,inAmt=null;
      amts.forEach(a=>{const r=a.x+a.w;const cand=[["out",cols.out],["in",cols.in],["bal",cols.bal]].filter(c=>c[1]!=null).map(c=>[c[0],Math.abs(c[1]-r)]).sort((x,y)=>x[1]-y[1]);
        const k=cand[0]&&cand[0][0];const av=amtVal(a.s);
        if(k==="bal")bal=av.neg?-av.n:av.n;else if(k==="out")outAmt=av.n;else if(k==="in")inAmt=av.n;});
      if(outAmt!=null)v=-outAmt;else if(inAmt!=null)v=inAmt;
    }
    if(v==null){
      const first=amtVal(amts[0].s);
      if(amts.length>=2){const lb=amtVal(amts[amts.length-1].s);bal=lb.neg?-lb.n:lb.n;}
      if(first.neg)v=-first.n;
      else if(bal!=null&&prevBal!=null){v=Math.abs((bal-prevBal)-(-first.n))<0.011?-first.n:Math.abs((bal-prevBal)-first.n)<0.011?first.n:-first.n;}
      else{v=/salary|wages|universal credit|dwp|hmrc|refund|transfer from|interest paid|received|bgc|fpi/i.test(text)?first.n:-first.n;unsure++;}
    }
    if(bal!=null)prevBal=bal;
    if(!(Math.abs(v)>0)){skipped++;continue;}
    items.push({d,v,note:desc,bankCat:""});
  }
  if(!items.length)return {error:"Couldn't find any transactions in this PDF. If it's a statement, try the CSV from online banking instead, or tell Claude which bank it's from."};
  return {items,skipped,unsure,flippable:false};
}

/* ---- items → new payments (shared by CSV and PDF) ---- */
function buildRecords(items,acctId){
  const existing=new Set(allTx(real).filter(t=>t.acct===acctId).map(t=>t.d+"|"+t.amt+"|"+t.note.toLowerCase()));
  const parsed=[];let dupes=0,skipped=0;
  items.forEach(({d,v,note,bankCat})=>{
    note=note||"Payment";const amt=Math.round(Math.abs(v)*100)/100;
    const savingLike=/savings|save the change|\bpot\b|round ?up|\bisa\b/i.test(note);
    if(v>0&&savingLike){skipped++;return;}
    const kind=v<0?(savingLike?"save":"spend"):"income";
    let cat=kind==="spend"?guessCat(note):kind==="save"?"Savings":"Income";
    if(kind==="spend"&&cat==="Other"&&bankCat){if(/groceries/.test(bankCat))cat="Groceries";else if(/eating|food|takeaway/.test(bankCat))cat="Eating out";else if(/transport|travel/.test(bankCat))cat="Transport";else if(/bills/.test(bankCat))cat="Bills";else if(/shopping/.test(bankCat))cat="Shopping";else if(/entertainment/.test(bankCat))cat="Fun";}
    const key=d+"|"+amt+"|"+note.toLowerCase();if(existing.has(key)){dupes++;return;}existing.add(key);
    const rec={id:uid(),d,amt,kind,acct:acctId,cat,note};
    if(kind==="spend"){const nl=note.toLowerCase();const dm=(real.debts||[]).find(y=>y.match&&nl.includes(y.match.toLowerCase()));if(dm){rec.cat="Debt repayment";rec.debtId=dm.id;}}
    parsed.push(rec);});
  return {parsed,dupes,skipped};
}

function importSheet(acctId){
  ensureReal();const a=acctById(real,acctId);
  openSheet(`<div><h2 style="margin-bottom:6px">Import into ${esc(a.name)}</h2>
   <p class="small muted" style="margin:0 0 10px">Choose a statement from this bank: the <strong>PDF</strong> from the banking app, or a <strong>CSV</strong> from online banking. It's read on this phone and never uploaded.</p>
   <div class="field"><label for="iFile">Statements (PDF or CSV)</label><input id="iFile" type="file" multiple accept=".pdf,.csv,application/pdf,text/csv"><span class="small muted">You can pick several months at once.</span></div>
   <div id="iOut"></div>
   <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn" type="button" id="iCancel">Cancel</button><button class="btn primary" type="button" id="iGo" disabled>Import</button></div></div>`,()=>{
    $("#iCancel").onclick=closeSheet;let parsed=[];
    const out=$("#iOut");

      if(res.error){out.innerHTML=`<p class="err">${esc(res.error)}</p>`;$("#iGo").disabled=true;return;}
      const b=buildRecords(res.items,acctId);parsed=b.parsed;

      const inn=parsed.filter(x=>x.kind==="income").reduce((s,x)=>s+x.amt,0);
      out.innerHTML=parsed.length?`<p style="margin:0">Found <strong>${parsed.length}</strong> new payments: <span class="num">${gbp2(sp)}</span> out, <span class="num">${gbp2(inn)}</span> in${b.dupes?`. ${b.dupes} were already imported`:""}${skipped?`. ${skipped} lines skipped`:""}.</p>
        <p class="small muted" style="margin:4px 0 0">Check the first few look right before importing.</p>
        <div class="preview"><table><tr><th>Date</th><th>Description</th><th>Amount</th><th>Type</th></tr>${parsed.slice(0,8).map(x=>`<tr><td>${x.d}</td><td>${esc(x.note)}</td><td class="num">${x.kind==="income"?"+":"−"}${gbp2(x.amt).replace("−","")}</td><td>${x.kind==="spend"?esc(x.cat):x.kind==="save"?"Saved":"Money in"}</td></tr>`).join("")}</table></div>
        <label class="small row" style="gap:6px;flex-wrap:nowrap"><input type="checkbox" id="iFlip"> Money in and out look the wrong way round (swap them)</label>`
        :`<p class="err">No new payments found${b.dupes?`. All ${b.dupes} were already imported`:""}.</p>`;
      $("#iGo").disabled=!parsed.length;
    };
    const readFile=file=>new Promise(res=>{
      const isPdf=/\.pdf$/i.test(file.name)||file.type==="application/pdf";
      const r=new FileReader();
      r.onerror=()=>res({error:"Couldn't read "+file.name+"."});
      r.onload=async()=>{
        try{res(isPdf?await pdfItems(new Uint8Array(r.result)):csvItems(String(r.result)));}
        catch(err){res({error:isPdf?"Couldn't read "+file.name+". Check you're online the first time you import a PDF.":"Couldn't read "+file.name+"."});}
      };
      if(isPdf)r.readAsArrayBuffer(file);else r.readAsText(file);
    });
    $("#iFile").addEventListener("change",async e=>{
      const files=[...e.target.files];if(!files.length)return;
      $("#iGo").disabled=true;

        const res=await readFile(files[i]);
        if(res.error)errors.push(files.length>1?files[i].name+": "+res.error:res.error);else{items.push(...res.items);skipped+=res.skipped||0;}
      }
      if(!items.length){show({error:errors.join(" ")||"No payments found."});return;}
      show({items,skipped});
      if(errors.length)out.insertAdjacentHTML("afterbegin",`<p class="err">${errors.map(esc).join("<br>")}</p>`);
      if(files.length>1)out.insertAdjacentHTML("afterbegin",`<p class="small muted" style="margin:0 0 4px">${files.length-errors.length} of ${files.length} files read.</p>`);
    });
    $("#iGo").onclick=()=>{
      const flip=$("#iFlip")&&$("#iFlip").checked;
      const touched=new Set();
      parsed.forEach(x=>{if(flip){if(x.kind==="spend"){x.kind="income";x.cat="Income";}else if(x.kind==="income"){x.kind="spend";x.cat=guessCat(x.note);}}

        if(x.debtId){const dd=real.debts.find(y=>y.id===x.debtId);if(dd)dd.balance=Math.max(0,Math.round((dd.balance-x.amt)*100)/100);}
        const k=x.d.slice(0,7);(real.months[k]=real.months[k]||[]).push(x);touched.add(k);});
      touched.forEach(persistMonth);
      if(parsed.some(x=>x.debtId))persistSettings();
      closeSheet();render();toast(`Imported ${parsed.length} payments`);checkOverBudget();
    };
  });
}

  else if(act==="edit-tx"){ensureReal();const t=(real.months[b.dataset.m]||[]).find(x=>x.id===id);if(t)txSheet(t);}
});
document.addEventListener("change",e=>{
  if(e.target.id==="fMonth"){txFilter.month=e.target.value;render();}
  else if(e.target.id==="fAcct"){txFilter.acct=e.target.value;render();}
  else if(e.target.id==="rFile"){const f=e.target.files[0];e.target.value="";if(f)restoreBackup(f);}
  else if(["nOver","nDue","nWeekly","nPay"].includes(e.target.id)){ensureReal();const k={nOver:"over",nDue:"due",nWeekly:"weekly",nPay:"pay"}[e.target.id];real.notify=Object.assign(defaultNotify(),real.notify||{});real.notify[k]=e.target.checked;saveAll();}
  else if(e.target.id==="pPayday"){ensureReal();const v=parseInt(e.target.value,10);real.payday=v>=1&&v<=31?v:0;saveAll();render();toast(real.payday?"Payday saved":"Payday cleared");setTimeout(maybeCheckin,800);}
  else if(["pIncome","pGoal","pBills"].includes(e.target.id)){
    ensureReal();const v=money(e.target.value);const n=isFinite(v)&&v>=0?v:0;
    if(e.target.id==="pIncome")real.income=n;else if(e.target.id==="pGoal")real.goal=n;else real.bills=n;
    persistSettings();render();toast("Saved");}
});

render();
initStore();
let swReg=null,reloading=false;
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{swReg=r;}).catch(()=>{});});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloading||$("#sheetRoot").innerHTML)return;reloading=true;location.reload();});
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){render();setTimeout(maybeCheckin,400);if(swReg)swReg.update().catch(()=>{});}});
})();
</script>
</body>
</html>
